<!DOCTYPE html>
<html lang="en" data-theme="dark" class="i18n-loading">
<head>

    <title>DewSecure - Pricing</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swup@4/dist/swup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/DewSecure.png">
<style>
        /* 防止 i18n 加载期间闪烁 */
        html.i18n-loading body {
            opacity: 0 !important;
            visibility: hidden !important;
        }
        html[data-i18n-ready="true"] body {
            opacity: 1 !important;
            visibility: visible !important;
            transition: opacity 0.2s ease-out;
        }
    </style>
</head>
<body>
    <header>
        <a href="/index.html" class="logo"><img src="/DewSecure.png" alt="DewSecure"> DewSecure</a>
        <nav>
            <a href="/index.html" data-i18n="nav_home"></a>
            <a href="/pricing.html" data-i18n="nav_pricing"></a>
            <a href="/pentest/" target="_blank" data-i18n="nav_pentest"></a>
            <a href="/update/" data-i18n="nav_update"></a>
            <a href="/guide/" data-i18n="nav_guide"></a>
            <a href="/about/" data-i18n="nav_about"></a>
            <a href="/login/" data-i18n="nav_login"></a>
        </nav>
        <div class="lang-switch">
            <button class="lang-toggle-btn" style="background:none;border:none;color:#cbd5e1;font-size:24px;cursor:pointer;padding:0;">🌐</button>
            <ul class="lang-dropdown">
                <li data-lang="zh" class="lang-option">中文 (简体)</li>
                <li data-lang="en" class="lang-option">English</li>
                <li data-lang="ms" class="lang-option">Bahasa Melayu</li>
                <li data-lang="ja" class="lang-option">日本語</li>
                <li data-lang="ko" class="lang-option">한국어</li>
                <li data-lang="es" class="lang-option">Español</li>
                <li data-lang="pt" class="lang-option">Português</li>
                <li data-lang="de" class="lang-option">Deutsch</li>
                <li data-lang="fr" class="lang-option">Français</li>
            </ul>
        </div>

    <main id="swup" class="transition-fade">
        <div class="pricing-wrapper">
            <h2 class="pricing-title" data-i18n="pricing_title"></h2>
            <div class="pricing-grid">
                <div class="price-card">
                    <h3 data-i18n="free_plan"></h3>
                    <div class="price-amount">$0<span> / <span data-i18n="forever"></span></span></div>
                    <p class="price-desc" data-i18n="free_desc"></p>
                    <ul class="price-features">
                        <li><i class="fa-solid fa-check"></i> <span data-i18n="free_feat1"></span></li>
                        <li><i class="fa-solid fa-check"></i> <span data-i18n="free_feat2"></span></li>
                    </ul>
                    <a href="/index.html" class="btn-pricing btn-free" data-i18n="free_btn"></a>
                </div>

                <div class="price-card highlight">
                    <h3 data-i18n="pro_plan"></h3>
                    <div class="price-amount">$11.99<span> / <span data-i18n="year"></span></span></div>
                    <p class="price-desc" data-i18n="pro_desc"></p>
                    <ul class="price-features">
                        <li><i class="fa-solid fa-check"></i> <span data-i18n="pro_feat1"></span></li>
                        <li><i class="fa-solid fa-check"></i> <div><span data-i18n="pro_feat2"></span><div class="tooltip-container"><i class="fa-solid fa-circle-question tooltip-icon"></i><div class="tooltip-content"><h5 data-i18n="tooltip_title"></h5><p data-i18n="tooltip_desc"></p></div></div></div></li>
                    </ul>
                    <button class="btn-pricing btn-pro" data-i18n="pro_btn"></button>
                </div>

                <div class="price-card">
                    <h3 data-i18n="fam_plan"></h3>
                    <div class="price-amount">$29.99<span> / <span data-i18n="year"></span></span></div>
                    <p class="price-desc" data-i18n="fam_desc"></p>
                    <ul class="price-features">
                        <li><i class="fa-solid fa-check"></i> <span data-i18n="fam_feat1"></span></li>
                        <li><i class="fa-solid fa-check"></i> <div><span data-i18n="fam_feat2"></span><div class="tooltip-container"><i class="fa-solid fa-circle-question tooltip-icon"></i><div class="tooltip-content"><h5 data-i18n="tooltip_title"></h5><p data-i18n="tooltip_desc_family"></p></div></div></div></li>
                    </ul>
                    <button class="btn-pricing btn-fam" data-i18n="fam_btn"></button>
                </div>
            </div>

            <!-- 🌟 新增：邀请返利营销横幅 -->
            <div class="invite-promo-banner">
                <div class="promo-icon">🎁</div>
                <div class="promo-text">
                    <h3 data-i18n="pricing_promo_title"></h3>
                    <p data-i18n="pricing_promo_desc"></p>
                </div>
                <button class="btn-promo" onclick="window.location.href='/dashboard.html'" data-i18n="pricing_promo_btn"></button>
            </div>
            <!-- 🌟 新增结束 -->

                <div class="comparison-table">
                    <div class="comp-row comp-table-header">

                        <div class="comp-val text-val" data-i18n="comp_table_pro"></div>
                        <div class="comp-val text-val" data-i18n="comp_table_fam"></div>

                    <div class="comp-category" data-i18n="comp_cat_core"></div>

                      <div class="comp-row"><div class="comp-feature"><strong data-i18n="comp_social_tracker"></strong><span data-i18n="comp_social_tracker_desc"></span></div><div class="comp-val yes"><i class="fa-solid fa-check"></i></div><div class="comp-val yes"><i class="fa-solid fa-check"></i></div><div class="comp-val yes"><i class="fa-solid fa-check"></i></div></div>

                    <div class="comp-row"><div class="comp-feature"><strong data-i18n="comp_antiblock"></strong><span data-i18n="comp_antiblock_desc"></span></div><div class="comp-val yes"><i class="fa-solid fa-check"></i></div><div class="comp-val yes"><i class="fa-solid fa-check"></i></div><div class="comp-val yes"><i class="fa-solid fa-check"></i></div></div>

                    <div class="comp-row"><div class="comp-feature"><strong data-i18n="comp_placeholder"></strong><span data-i18n="comp_placeholder_desc"></span></div><div class="comp-val yes"><i class="fa-solid fa-check"></i></div><div class="comp-val yes"><i class="fa-solid fa-check"></i></div><div class="comp-val yes"><i class="fa-solid fa-check"></i></div></div>
                    
                    <div class="comp-category" data-i18n="comp_cat_pro" style="color: #d29922;"></div>
                    <div class="comp-row"><div class="comp-feature"><strong data-i18n="comp_ai_4class"></strong><span data-i18n="comp_ai_4class_desc"></span></div><div class="comp-val no"><i class="fa-solid fa-xmark"></i></div><div class="comp-val yes"><i class="fa-solid fa-check"></i></div><div class="comp-val yes"><i class="fa-solid fa-check"></i></div></div>
                    <div class="comp-row"><div class="comp-feature"><strong data-i18n="comp_realtime_threat"></strong><span data-i18n="comp_realtime_threat_desc"></span></div><div class="comp-val no"><i class="fa-solid fa-xmark"></i></div><div class="comp-val yes"><i class="fa-solid fa-check"></i></div><div class="comp-val yes"><i class="fa-solid fa-check"></i></div></div>

                    <div class="comp-category" data-i18n="comp_cat_dev"></div>
                    <div class="comp-row"><div class="comp-feature"><strong data-i18n="comp_dev_count"></strong><div style="font-size: 11px; color: #8b949e; margin-top: 4px;" data-i18n="comp_dev_count_hint"></div></div><div class="comp-val text-val" data-i18n="comp_dev_count_free"></div><div class="comp-val text-val" data-i18n="comp_dev_count_pro"></div><div class="comp-val text-val" data-i18n="comp_dev_count_fam"></div></div>
                    <div class="comp-row"><div class="comp-feature"><strong data-i18n="comp_support"></strong></div><div class="comp-val text-val" data-i18n="comp_support_free"></div><div class="comp-val text-val" data-i18n="comp_support_pro"></div><div class="comp-val text-val" data-i18n="comp_support_fam"></div></div>
                </div>
            </div>
        </div>

                      </div>

                      <div class="comp-row">
                          <div class="comp-feature"><strong data-i18n="comp_ai_4class"></strong> <span data-i18n="comp_ai_4class_desc"></span></div>
                          <div class="comp-val no"><i class="fa-solid fa-xmark"></i></div>
                          <div class="comp-val yes"><i class="fa-solid fa-check"></i></div>
