<!DOCTYPE html>
<html lang="en" data-theme="dark" class="i18n-loading">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DewSecure - Dashboard</title>
    <!-- 🔒 H4 修复：安全提取 Hash 中的 Token，防止 URL 泄露 -->
    <script>
    (function() {
        const hash = window.location.hash;
        if (hash && hash.includes('token=')) {
            const hashParams = new URLSearchParams(hash.substring(1));
            const token = hashParams.get('token');
            const refresh = hashParams.get('refresh');
            if (token) {
                // 1. 存入 sessionStorage，供 app-init.js 和 auth-nav.js 读取
                sessionStorage.setItem('ds_handoff_token', token);
                if (refresh) sessionStorage.setItem('ds_handoff_refresh', refresh);
                
                // 2. 转换为标准的 Supabase OAuth Hash 格式，供原生 SDK 自动接管
                const supabaseHash = `#access_token=${token}&refresh_token=${refresh || ''}&type=magiclink`;
                
                // 3. 立即清理真实地址栏的 Hash，防止用户复制或历史记录泄露
                window.history.replaceState(null, '', window.location.pathname + window.location.search);
                
                // 4. 如果需要，把标准的 hash 塞给后续脚本（或直接靠 sessionStorage 兜底）
                window.__DS_HANDOFF_TOKEN = token;
            }
        }
    })();
    </script>

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swup@4/dist/swup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/DewSecure.png">
<style>
        /* 防止 i18n 加载期间闪烁 */
        html.i18n-loading body {
            opacity: 0 !important;
            visibility: hidden !important;
        }
        html[data-i18n-ready="true"] body {
            opacity: 1 !important;
            visibility: visible !important;
            transition: opacity 0.2s ease-out;
        }
    </style>
</head>

        <div style="width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #58a6ff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>
    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>

        <a href="/index.html" class="logo"><img src="/DewSecure.png" alt="DewSecure"> DewSecure</a>

            <a href="/pentest/" target="_blank" data-i18n="nav_pentest"></a>
            <a href="/update/" data-i18n="nav_update"></a>
            <a href="/guide/" data-i18n="nav_guide"></a>
            <a href="/about/" data-i18n="nav_about"></a>
            <a href="/dashboard.html" style="display:none;" data-i18n="nav_dashboard"></a>
            <a href="/login/" data-i18n="nav_login"></a>
        </nav>
        <div class="lang-switch">
            <button class="lang-toggle-btn" style="background:none;border:none;color:#cbd5e1;font-size:24px;cursor:pointer;padding:0;">🌐</button>
            <ul class="lang-dropdown">
                <li data-lang="zh" class="lang-option">中文 (简体)</li>
                <li data-lang="en" class="lang-option">English</li>
                <li data-lang="ms" class="lang-option">Bahasa Melayu</li>
                <li data-lang="ja" class="lang-option">日本語</li>
                <li data-lang="ko" class="lang-option">한국어</li>
                <li data-lang="es" class="lang-option">Español</li>
                <li data-lang="pt" class="lang-option">Português</li>
                <li data-lang="de" class="lang-option">Deutsch</li>
                <li data-lang="fr" class="lang-option">Français</li>
            </ul>
        </div>
    </header>

    <main id="swup" class="transition-fade">
        <div class="dashboard-container" id="mainContent">
            <div class="left-column">
                <div class="card">
                    <h3><i class="fa-solid fa-shield-halved"></i> <span data-i18n="dash_sub_status"></span></h3>
                    <div class="data-row">
                        <span class="data-label" data-i18n="dash_tier_label"></span>
                        <span id="tierBadge" class="status-badge skeleton-text">加载中...</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label" data-i18n="dash_days_left"></span>
                        <span class="data-value" id="daysLeft">-</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label" data-i18n="dash_expire_date"></span>
                        <span class="data-value" id="expireDate">-</span>
                    </div>
                    
                    <!-- 🌟 按钮控制区：已注入所有需要的按钮 -->
                    <div style="margin-top: 25px; display: flex; flex-wrap: wrap; gap: 10px;">
                        <button class="btn btn-primary" id="btnUpgrade" onclick="window.location.href='/pricing.html'" data-i18n="dash_btn_upgrade"></button>
                        
                        <!-- 领取试用按钮 (绿色) -->
                        <button class="btn hidden" id="btnClaimTrial" style="background:#238636; color:#fff; border:none;" data-i18n="dash_btn_claim_trial"></button>
                        
                        <!-- 管理订阅按钮 (蓝色) -->
                        <button class="btn btn-primary hidden" id="btnManageSub" data-i18n="dash_btn_manage"></button>
                        
                        <!-- 取消订阅按钮 (红色) -->
                        <button class="btn btn-danger hidden" id="btnCancelSub" data-i18n="dash_btn_cancel"></button>
                        
                        <!-- 退出家庭组按钮 (红色) -->
                        <button class="btn btn-danger hidden" id="btnLeaveFamily" data-i18n="dash_btn_leave_family"></button>
                    </div>
                </div>

                <div class="card hidden" id="deviceCard" style="margin-bottom: 24px;">
                    <h3><i class="fa-solid fa-laptop"></i> <span data-i18n="dash_device_title"></span></h3>
                    <p style="color:#8b949e; font-size:14px; margin-bottom: 15px;" id="deviceDesc"></p>
                    <div id="deviceSlots" style="display: flex; flex-direction: column; gap: 10px;"></div>
                </div>

                <div class="card hidden" id="familyCard" style="margin-bottom: 24px;">
                    <h3><i class="fa-solid fa-users"></i> <span data-i18n="dash_family_title"></span></h3>
                    <p style="color:#8b949e; font-size:14px; margin-bottom: 15px;" id="familyDesc"></p>
                    
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <input type="email" id="familyEmailInput" placeholder="Family member email" data-i18n-placeholder="dash_family_input_ph" style="flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; color: #fff; outline: none;">
                        <button class="btn btn-primary" id="btnInviteFamily" data-i18n="dash_family_btn_invite"></button>
                    </div>

                    <div id="familyMembersList">
                    </div>
                </div>

                <div class="card" id="inviteCard" style="margin-top: 24px;">
                    <h3><i class="fa-solid fa-gift"></i> <span data-i18n="dash_invite_title"></span></h3>
                    <p style="color:#8b949e; font-size:14px;" data-i18n="dash_invite_desc"></p>
                    <div class="invite-box">
                        <div class="invite-input" id="myInviteCode"></div>
                        <button class="btn btn-primary" id="btnGenInvite" data-i18n="dash_invite_gen"></button>
                        <button class="btn btn-primary hidden" id="btnCopyInvite" style="background:#58a6ff; color:#fff;" data-i18n="dash_invite_copy"></button>
                    </div>
                    <div style="margin-top: 15px; font-size: 13px; color: #8b949e;">
                        <span data-i18n="dash_invite_count"></span><span id="inviteCount" style="color:#58a6ff; font-weight:bold;">0</span>
                    </div>
                </div>
            </div>

            <div class="right-column">
                <!-- 🌟 全新通知中心：注入 header、未读角标与全部已读按钮 -->
                <div class="card" style="height: 100%; display: flex; flex-direction: column;">
                    <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px;">
                        <!-- 第一行：通知中心标题 -->
                        <h3 style="margin-bottom: 0; display: flex; align-items: center; gap: 8px;">
                            <i class="fa-solid fa-bell"></i> 
                            <span data-i18n="dash_notif_title"></span>
                        </h3>
                        <!-- 第二行：未读角标（左）与全部删除按钮（右），同一行 -->
                        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 24px;">
                            <span id="unreadBadge" class="status-badge" style="background: #da3633; color: #fff; font-size: 12px; padding: 2px 8px; display: inline-block;">未读 (0)</span>
                            <button id="btnDeleteAll" class="btn" style="padding: 4px 10px; font-size: 12px; background: transparent; border: 1px solid #30363d; color: #f85149; border-radius: 6px; transition: 0.2s; white-space: nowrap; min-width: 85px; text-align: center;" data-i18n="dash_notif_delete_all"></button>
                        </div>
                    </div>
                    <ul class="notification-list" id="notificationList" style="flex: 1; overflow-y: auto; padding-right: 5px;">
                        <li class="notification-item skeleton-text" style="text-align:center;" data-i18n="dash_notif_loading"></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 取消订阅确认弹窗 -->
        <div class="modal-overlay" id="cancelModal">
            <div class="modal-content">
                <h3 data-i18n="dash_cancel_title"></h3>
                <p style="font-size:14px; color:#8b949e; margin-bottom:15px;" data-i18n="dash_cancel_desc"></p>
                <p id="cancelTip" style="font-size:14px; color:#58a6ff; font-weight:bold; margin-bottom:15px;"></p>
                <p style="font-size:14px; color:#c9d1d9;" data-i18n="dash_cancel_reason"></p>
                <textarea id="cancelReason" placeholder="e.g., Too expensive, missing features..." data-i18n-placeholder="dash_cancel_ph"></textarea>
                <div class="modal-actions">
                    <button class="btn" style="background:transparent; color:#8b949e;" id="btnCloseModal" data-i18n="dash_cancel_no"></button>
                    <button class="btn btn-danger" id="btnConfirmCancel" data-i18n="dash_cancel_yes"></button>
                </div>
