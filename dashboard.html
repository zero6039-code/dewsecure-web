<!DOCTYPE html>
<html lang="en" data-theme="dark" class="i18n-loading">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DewSecure - Dashboard</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .i18n-loading [data-i18n] { visibility: hidden !important; }
        .dashboard-container { max-width: 1200px; margin: 100px auto 40px; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        .card { background: rgba(22, 27, 34, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 30px; margin-bottom: 24px; }
        .card h3 { color: #fff; margin-bottom: 20px; font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; background: rgba(88,166,255,0.15); color: #58a6ff; border: 1px solid rgba(88,166,255,0.3); }
        .status-pro { background: rgba(255, 196, 0, 0.15); color: #ffc400; border-color: rgba(255, 196, 0, 0.3); }
        .data-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .data-row:last-child { border-bottom: none; }
        .data-label { color: #8b949e; }
        .data-value { color: #fff; font-weight: 600; }
        .btn { padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; transition: 0.3s; font-size: 14px; }
        .btn-primary { background: #fff; color: #000; }
        .btn-primary:hover { background: #e6edf3; }
        .btn-danger { background: rgba(248, 81, 73, 0.1); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); }
        .btn-danger:hover { background: rgba(248, 81, 73, 0.2); }
        .invite-box { display: flex; gap: 10px; margin-top: 15px; }
        .invite-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px dashed rgba(88,166,255,0.5); border-radius: 10px; padding: 12px; color: #58a6ff; font-family: monospace; font-size: 16px; letter-spacing: 2px; text-align: center; }
        .notification-list { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; }
        .notification-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .notification-item.unread { background: rgba(88,166,255,0.05); }
        .notification-time { font-size: 12px; color: #8b949e; margin-top: 5px; }
        
        /* 弹窗样式 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { background: rgba(22, 27, 34, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; max-width: 450px; width: 90%; }
        .modal-content h3 { margin-bottom: 15px; color: #fff; }
        .modal-content textarea { width: 100%; height: 100px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; color: #fff; margin-top: 10px; resize: none; outline: none; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header style="position: fixed; top:0; width: 100%; background: rgba(13,17,23,0.8); backdrop-filter: blur(12px); z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05);">
        <div style="max-width: 1200px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">
            <a href="/index.html" class="logo" style="color:#fff; font-weight:800; font-size:20px; text-decoration:none;"><img src="/DewSecure.png" style="height:24px; vertical-align:middle;"> DewSecure</a>
            <div>
                <span id="userEmail" style="margin-right: 15px; color:#8b949e; font-size:14px;">加载中...</span>
                <button class="btn btn-danger" id="btnLogout">退出登录</button>
            </div>
        </div>
    </header>

    <div class="dashboard-container" id="mainContent" style="display: none;">
        <!-- 左侧：状态与邀请 -->
        <div class="left-column">
            <div class="card">
                <h3><i class="fa-solid fa-shield-halved"></i> 当前订阅状态</h3>
                <div class="data-row">
                    <span class="data-label">账户等级</span>
                    <span id="tierBadge" class="status-badge">加载中...</span>
                </div>
                <div class="data-row">
                    <span class="data-label">剩余有效天数</span>
                    <span class="data-value" id="daysLeft">-</span>
                </div>
                <div class="data-row">
                    <span class="data-label">到期时间</span>
                    <span class="data-value" id="expireDate">-</span>
                </div>
                <div style="margin-top: 25px; display: flex; gap: 10px;">
                    <button class="btn btn-primary" id="btnUpgrade" onclick="window.location.href='/pricing.html'">升级/续费高级版</button>
                    <button class="btn btn-danger hidden" id="btnCancelSub">取消订阅</button>
                </div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-gift"></i> 邀请好友，获取奖励</h3>
                <p style="color:#8b949e; font-size:14px;">邀请好友注册并激活。每成功激活1次，您将获得额外 <strong>30天</strong> 高级版（上限12次）。</p>
                <div class="invite-box">
                    <div class="invite-input" id="myInviteCode">点击下方生成</div>
                    <button class="btn btn-primary" id="btnGenInvite">生成邀请码</button>
                    <button class="btn btn-primary hidden" id="btnCopyInvite" style="background:#58a6ff; color:#fff;">复制</button>
                </div>
                <div style="margin-top: 15px; font-size: 13px; color: #8b949e;">
                    已成功邀请人数：<span id="inviteCount" style="color:#58a6ff; font-weight:bold;">0</span> / 12
                </div>
            </div>
        </div>

        <!-- 右侧：通知中心 -->
        <div class="right-column">
            <div class="card" style="height: 100%;">
                <h3><i class="fa-solid fa-bell"></i> 通知中心</h3>
                <ul class="notification-list" id="notificationList">
                    <li class="notification-item" style="text-align:center; color:#8b949e;">暂无新通知</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 取消订阅弹窗 -->
    <div class="modal-overlay" id="cancelModal">
        <div class="modal-content">
            <h3>确认取消订阅？</h3>
            <p style="font-size:14px; color:#8b949e; margin-bottom:15px;">您的订阅将持续有效直到当前周期结束（<span id="modalExpireDate" style="color:#fff;"></span>）。在此期间，您可以继续享受所有高级功能。</p>
            <p style="font-size:14px; color:#c9d1d9;">如果不介意，能告诉我们取消的原因吗？(选填)</p>
            <textarea id="cancelReason" placeholder="例如：太贵了、功能不符合预期、体验不好..."></textarea>
            <div class="modal-actions">
                <button class="btn" style="background:transparent; color:#8b949e;" id="btnCloseModal">暂不取消</button>
                <button class="btn btn-danger" id="btnConfirmCancel">确认取消</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uvbaioqqjqseapcancvi.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_xiiA-yt_jRKkzRdkYkoWJA_CVZjNjq8';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentProfile = null;

        async function initDashboard() {
            try {
                // 1. 检查登录状态 ✅ 已修复为 supabaseClient
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (error || !session) {
                    window.location.href = '/login.html';
                    return;
                }
                currentUser = session.user;
                document.getElementById('userEmail').textContent = currentUser.email;

                // 2. 获取 Profile 数据 ✅ 已修复为 supabaseClient
                const { data: profile, error: profileErr } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();
                
                if (profileErr) throw profileErr;
                currentProfile = profile;

                // 3. 渲染数据
                renderProfileStatus(profile);
                fetchNotifications();

                // 4. 绑定按钮事件 ✅ 已修复为 supabaseClient
                document.getElementById('btnLogout').onclick = async () => { 
                    await supabaseClient.auth.signOut(); 
                    window.location.href = '/'; 
                };
                document.getElementById('btnGenInvite').onclick = generateInvite;
                document.getElementById('btnCancelSub').onclick = () => document.getElementById('cancelModal').classList.add('active');
                document.getElementById('btnCloseModal').onclick = () => document.getElementById('cancelModal').classList.remove('active');
                document.getElementById('btnConfirmCancel').onclick = submitCancelSubscription;

                document.getElementById('mainContent').style.display = 'grid';
            } catch (err) {
                console.error("Dashboard 初始化错误:", err);
                alert("加载数据失败，请重新登录。");
                window.location.href = '/login.html';
            }
        }

        function renderProfileStatus(profile) {
            if (!profile) return;
            const tierBadge = document.getElementById('tierBadge');
            const daysLeftEl = document.getElementById('daysLeft');
            const expireDateEl = document.getElementById('expireDate');
            const btnCancel = document.getElementById('btnCancelSub');
            const btnUpgrade = document.getElementById('btnUpgrade');

            document.getElementById('inviteCount').textContent = profile.invite_success_count || 0;

            // 计算到期时间
            let expireDate = profile.trial_ends_at ? new Date(profile.trial_ends_at) : null;
            const now = new Date();

            if (profile.tier === 'free') {
                tierBadge.textContent = '免费版 (Free)';
                tierBadge.className = 'status-badge';
                daysLeftEl.textContent = '永久有效';
                expireDateEl.textContent = '-';
                btnCancel.classList.add('hidden');
                btnUpgrade.classList.remove('hidden');
            } else {
                tierBadge.textContent = profile.tier === 'pro' ? '高级版 (Pro)' : '家庭版 (Family)';
                tierBadge.className = 'status-badge status-pro';
                
                if (expireDate && expireDate > now) {
                    const diffTime = Math.abs(expireDate - now);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                    daysLeftEl.textContent = `${diffDays} 天`;
                    daysLeftEl.style.color = diffDays <= 7 ? '#f85149' : '#fff';
                    expireDateEl.textContent = expireDate.toLocaleDateString('zh-CN');
                    document.getElementById('modalExpireDate').textContent = expireDate.toLocaleDateString('zh-CN');
                    
                    btnCancel.classList.remove('hidden');
                    btnUpgrade.textContent = '续费 / 延长订阅';
                } else {
                    daysLeftEl.textContent = '已过期';
                    btnCancel.classList.add('hidden');
                    btnUpgrade.classList.remove('hidden');
                }
            }
        }

        async function generateInvite() {
            const btn = document.getElementById('btnGenInvite');
            btn.disabled = true;
            btn.textContent = '生成中...';

            try {
                // ✅ 已修复为 supabaseClient
                const { data, error } = await supabaseClient.rpc('generate_invitation_code');
                if (error) throw error;
                
                document.getElementById('myInviteCode').textContent = data;
                btn.classList.add('hidden');
                
                const copyBtn = document.getElementById('btnCopyInvite');
                copyBtn.classList.remove('hidden');
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(data);
                    copyBtn.textContent = '已复制!';
                    setTimeout(() => copyBtn.textContent = '复制', 2000);
                };
            } catch (err) {
                alert('生成失败: ' + err.message);
                btn.disabled = false;
                btn.textContent = '生成邀请码';
            }
        }

        async function fetchNotifications() {
            // ✅ 已修复为 supabaseClient
            const { data, error } = await supabaseClient
                .from('notifications')
                .select('*')
                .order('created_at', { ascending: false });

            const list = document.getElementById('notificationList');
            if (error || !data || data.length === 0) return;

            list.innerHTML = '';
            data.forEach(n => {
                const li = document.createElement('li');
                li.className = `notification-item ${n.is_read ? '' : 'unread'}`;
                li.innerHTML = `
                    <div style="font-weight: 600; color: #fff; margin-bottom:4px;">${n.title}</div>
                    <div style="color: #c9d1d9; line-height: 1.4;">${n.message}</div>
                    <div class="notification-time">${new Date(n.created_at).toLocaleString()}</div>
                `;
                list.appendChild(li);
            });
        }

        async function submitCancelSubscription() {
            const btn = document.getElementById('btnConfirmCancel');
            const reason = document.getElementById('cancelReason').value.trim();
            btn.disabled = true;
            btn.textContent = '处理中...';

            try {
                // ✅ 已修复为 supabaseClient
                await supabaseClient.from('reports').insert({
                    user_id: currentUser.id,
                    reporter_email: currentUser.email,
                    report_type: 'other',
                    url: 'Cancel Subscription Flow',
                    description: `[取消订阅原因] ${reason || '用户未填写'}`
                });

                alert('您的取消请求已记录。订阅将在当前周期结束后失效。');
                document.getElementById('cancelModal').classList.remove('active');
                document.getElementById('btnCancelSub').classList.add('hidden');
                document.getElementById('btnUpgrade').classList.remove('hidden');
            } catch (err) {
                alert('提交失败: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '确认取消';
            }
        }

        initDashboard();
    </script>
</body>
</html>
