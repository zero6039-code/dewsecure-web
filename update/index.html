<!DOCTYPE html>
<html lang="en" data-theme="dark" class="i18n-loading">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DewSecure - Changelog</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swup@4/dist/swup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/DewSecure.png">
</head>
<body>
    <header>
        <!-- 导航栏代码不动 -->
        <a href="/index.html" class="logo"><img src="/DewSecure.png" alt="DewSecure"> DewSecure</a>
        <nav>
            <a href="/index.html" data-i18n="nav_home">首页</a>
            <a href="/pricing.html" data-i18n="nav_pricing">定价</a>
            <a href="/pentest/" target="_blank" data-i18n="nav_pentest">安全审计</a>
            <a href="/update/" data-i18n="nav_update">更新日志</a>
            <a href="/guide/" data-i18n="nav_guide">使用指南</a>
            <a href="/about/" data-i18n="nav_about">关于我们</a>
            <a href="/login/" data-i18n="nav_login">登录</a>
        </nav>
        <div class="lang-switch">
            <button class="lang-toggle-btn" style="background:none;border:none;color:#cbd5e1;font-size:24px;cursor:pointer;padding:0;">🌐</button>
            <ul class="lang-dropdown">
                <li data-lang="zh" class="lang-option">中文 (简体)</li>
                <li data-lang="en" class="lang-option">English</li>
                <li data-lang="ms" class="lang-option">Bahasa Melayu</li>
                <li data-lang="ja" class="lang-option">日本語</li>
                <li data-lang="ko" class="lang-option">한국어</li>
                <li data-lang="es" class="lang-option">Español</li>
                <li data-lang="pt" class="lang-option">Português</li>
                <li data-lang="de" class="lang-option">Deutsch</li>
                <li data-lang="fr" class="lang-option">Français</li>
            </ul>
        </div>
    </header>

    <!-- 🌟 必须用 main 包裹，且把原本漏掉的 div.update-container 补回来 -->
    <main id="swup" class="transition-fade">
        <div class="update-container">
            <div class="translate-tip">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-language" style="font-size: 20px;"></i> 
                    Select Language:
                </span>
                <select id="my-lang-select">
                    <option value="en">English</option>
                    <option value="zh-CN">Chinese (Simplified)</option>
                    <option value="zh-TW">Chinese (Traditional)</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="it">Italian</option>
                    <option value="tr">Turkish</option>
                    <option value="vi">Vietnamese</option>
                    <option value="th">Thai</option>
                    <option value="id">Indonesian</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <option value="ms">Malay</option>
                    <option value="nl">Dutch</option>
                    <option value="pl">Polish</option>
                </select>
                <div id="google_translate_element"></div>
            </div>
            
            <div class="translatable-content">
                <h1>Changelog & Updates</h1>
                <div id="changelog-list">
                    <p style="color: #8b949e;">Loading updates...</p>
                </div>
            </div>
        </div>
    </main>

    
    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,zh-CN,zh-TW,ja,ko,fr,de,es,pt,ru,it,tr,vi,th,id,ar,hi,ms,nl,pl,sv,da,fi,no,cs,el,he,hu,ro,sk,uk',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.5/dist/umd/supabase.js" integrity="sha384-8HXYSNTFkkCTt8kh+CcRiz8onIBVSqWqL6Q0x960/dITz7nnQCQKKYyBY1fqPXmf" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/swup@4.8.1/dist/Swup.umd.js" integrity="sha384-s6N0IzfhKB37PIrwBNB6oclsqfesjGUeyVdouCCW6uCGURwA2Q0ABvulC7FY75eB" crossorigin="anonymous"></script>
    <script type="module" src="/js/auth-nav.js"></script>
    <script type="module" src="/js/app-init.js?v=5"></script>
    <script src="/js/i18n.js"></script>
</body>
</html>
