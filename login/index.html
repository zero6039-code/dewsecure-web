<!DOCTYPE html>
<html lang="en" data-theme="dark" class="i18n-loading">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DewSecure - Log In</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swup@4/dist/swup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/DewSecure.png">
<style>
        /* 防止 i18n 加载期间闪烁 */
        html.i18n-loading body {
            opacity: 0 !important;
            visibility: hidden !important;
        }
        html[data-i18n-ready="true"] body {
            opacity: 1 !important;
            visibility: visible !important;
            transition: opacity 0.2s ease-out;
        }
    </style>
</head>
<body>
    <header>
        <a href="/index.html" class="logo"><img src="/DewSecure.png" alt="DewSecure"> DewSecure</a>
        <nav>
            <a href="/index.html" data-i18n="nav_home"></a>
            <a href="/pricing.html" data-i18n="nav_pricing"></a>
            <a href="/pentest/" target="_blank" data-i18n="nav_pentest"></a>
            <a href="/update/" data-i18n="nav_update"></a>
            <a href="/guide/" data-i18n="nav_guide"></a>
            <a href="/about/" data-i18n="nav_about"></a>
            <a href="/login/" data-i18n="nav_login" style="display:none;"></a>
        </nav>
        <div class="lang-switch">
            <button class="lang-toggle-btn" style="background:none;border:none;color:#cbd5e1;font-size:24px;cursor:pointer;padding:0;">🌐</button>
            <ul class="lang-dropdown">
                <li data-lang="zh" class="lang-option">中文 (简体)</li>
                <li data-lang="en" class="lang-option">English</li>
                <li data-lang="ms" class="lang-option">Bahasa Melayu</li>
                <li data-lang="ja" class="lang-option">日本語</li>
                <li data-lang="ko" class="lang-option">한국어</li>
                <li data-lang="es" class="lang-option">Español</li>
                <li data-lang="pt" class="lang-option">Português</li>
                <li data-lang="de" class="lang-option">Deutsch</li>
                <li data-lang="fr" class="lang-option">Français</li>
            </ul>
        </div>
    </header>

    <main id="swup" class="transition-fade">
        <div class="login-layout">
            <div class="login-left">
                <h1 data-i18n="login_hero_title"></h1>
                <p data-i18n="login_hero_desc"></p>
            </div>
            <div class="login-right">
                <div class="login-card">
                    <div id="step-email">
                        <h2 data-i18n="login_welcome"></h2>
                        <p class="sub" data-i18n="login_sub"></p>
                        <div class="input-group">
                            <label data-i18n="login_email_label"></label>
                            <div class="input-wrapper">
                                <i class="fa-regular fa-envelope"></i>
                                <input type="email" id="emailInput" data-i18n-placeholder="login_email_ph" placeholder="" autocomplete="off">
                            </div>
                            <div id="emailError" class="error-msg"></div>
                        </div>
                        <button class="btn-login" id="btnSendOtp" data-i18n="login_btn"></button>
                        
                        <div class="divider" data-i18n="login_or"></div>
                        <div class="oauth-btns">
                            <!-- 只保留 Google 按钮，并添加 id -->
                            <div class="oauth-btn" id="googleLoginBtn"><i class="fa-brands fa-google"></i></div>
                            <!-- GitHub 和以太坊按钮已隐藏 -->
                        </div>
                        <div class="trial-badge" data-i18n="login_trial"></div>
                    </div>

                    <div id="step-otp" class="hidden">
                        <h2 data-i18n="login_otp_title"></h2>
                        <p class="sub"><span data-i18n="login_otp_sub_prefix"></span> <strong id="displayEmail"></strong> <span data-i18n="login_otp_sub_suffix"></span></p>
                        <div class="input-group">
                            <label data-i18n="login_otp_label"></label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-shield-halved"></i>
                                <input type="text" id="otpInput" maxlength="8" placeholder="12345678" autocomplete="one-time-code" style="letter-spacing: 4px; background: rgba(0,0,0,0.3);">
                            </div>
                            <div id="otpError" class="error-msg"></div>
                        </div>
                        <button class="btn-login" id="btnVerifyOtp" data-i18n="login_btn_verify"></button>
                        
                        <button class="btn-login" id="btnResendOtp" style="background:transparent; color:#58a6ff; margin-top:10px; border: none;" data-i18n="login_btn_resend"></button>
                        <button class="btn-login" id="btnBack" style="background:transparent; color:#8b949e; margin-top:10px;" data-i18n="login_btn_back"></button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.5/dist/umd/supabase.js" integrity="sha384-8HXYSNTFkkCTt8kh+CcRiz8onIBVSqWqL6Q0x960/dITz7nnQCQKKYyBY1fqPXmf" crossorigin="anonymous"></script> 
    <script src="https://cdn.jsdelivr.net/npm/swup@4.8.1/dist/Swup.umd.js" integrity="sha384-s6N0IzfhKB37PIrwBNB6oclsqfesjGUeyVdouCCW6uCGURwA2Q0ABvulC7FY75eB" crossorigin="anonymous"></script>
    <script type="module" src="/js/auth-nav.js"></script>
    <script type="module" src="/js/app-init.js?v=5"></script>
    <script src="/js/i18n.js"></script>


</body>
</html>
